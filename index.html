<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vzon - Discord Auth</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #202225; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { text-align: center; background: #2f3136; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); max-width: 400px; width: 100%; }
        h1 { margin-bottom: 20px; }
        button { 
            background-color: #5865F2; color: white; border: none; padding: 12px 24px; 
            border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%;
        }
        button:hover { background-color: #4752c4; }
        .token-box { margin-top: 20px; background: #40444b; padding: 10px; border-radius: 5px; word-break: break-all; font-family: monospace; font-size: 12px; text-align: left; max-height: 150px; overflow-y: auto; }
        .hidden { display: none; }
        .status { margin-top: 15px; color: #a3a6aa; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Vzon App</h1>
    
    <!-- Estado Inicial -->
    <div id="login-view">
        <button onclick="startLogin()">Iniciar Sesión con Discord</button>
        <p class="status" id="msg"></p>
    </div>

    <!-- Estado Conectado -->
    <div id="connected-view" class="hidden">
        <h2>Bienvenido, <span id="username"></span></h2>
        <p>Tu Token de Acceso:</p>
        <div class="token-box" id="token-display"></div>
        <button onclick="logout()" style="margin-top: 20px; background-color: #ed4245;">Cerrar Sesión</button>
    </div>
</div>

<script>
    // CONFIGURACIÓN
    const CLIENT_ID = '1567793753396088863'; // REEMPLAZA CON TU CLIENT ID
    const REDIRECT_URI = encodeURIComponent(window.location.origin + window.location.pathname);

    // Elementos del DOM
    const loginView = document.getElementById('login-view');
    const connectedView = document.getElementById('connected-view');
    const usernameSpan = document.getElementById('username');
    const tokenDisplay = document.getElementById('token-display');
    const msg = document.getElementById('msg');

    // Función para obtener parámetros de la URL
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    // Al cargar la página
    if (code) {
        exchangeCodeForToken(code);
    } else {
        checkExistingSession();
    }

    function startLogin() {
        window.location.href = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=code&scope=identify%20guilds%20email`;
    }

    async function exchangeCodeForToken(code) {
        msg.textContent = "Obteniendo token...";
        try {
            const response = await fetch('https://discord.com/api/oauth2/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: CLIENT_ID,
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: window.location.origin + window.location.pathname
                })
            });

            const data = await response.json();
            
            if (!data.access_token) throw new Error("No se recibió token");

            // Obtener datos del usuario
            const userRes = await fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${data.access_token}` }
            });
            const userData = await userRes.json();

            // Guardar sesión en localStorage
            localStorage.setItem('vzon_token', data.access_token);
            localStorage.setItem('vzon_user', JSON.stringify(userData));

            showConnected(userData);
        } catch (error) {
            msg.textContent = "Error al conectar. Intenta de nuevo.";
            console.error(error);
        }
    }

    function showConnected(userData) {
        loginView.classList.add('hidden');
        connectedView.classList.remove('hidden');
        usernameSpan.textContent = userData.username || userData.global_name;
        tokenDisplay.textContent = localStorage.getItem('vzon_token');
    }

    function checkExistingSession() {
        const token = localStorage.getItem('vzon_token');
        const user = localStorage.getItem('vzon_user');
        if (token && user) {
            try {
                showConnected(JSON.parse(user));
            } catch(e) {
                localStorage.removeItem('vzon_token');
                localStorage.removeItem('vzon_user');
            }
        }
    }

    function logout() {
        localStorage.removeItem('vzon_token');
        localStorage.removeItem('vzon_user');
        location.reload();
    }
</script>

</body>
</html>
