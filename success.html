<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Listo!</title>
    <style>
        body { background-color: #36393f; font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .card { background-color: #2f3136; padding: 40px; border-radius: 8px; text-align: center; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .check-icon { color: #43b581; font-size: 48px; margin-bottom: 20px; }
        h2 { margin: 0 0 10px 0; }
        p { color: #b9bbbe; font-size: 14px; margin-bottom: 20px; }
        button { padding: 10px 20px; background-color: #7289da; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        button:hover { background-color: #5c6eae; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check-icon">✓</div>
        <h2>¡Verificado!</h2>
        <p>Tu cuenta ha sido vinculada correctamente. Ya puedes disfrutar de todos los beneficios.</p>
        <button onclick="window.close()">Cerrar</button>
    </div>
</body>
</html>
